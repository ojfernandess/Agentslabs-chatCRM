openapi: 3.1.0
info:
  title: OpenConduit API
  version: 0.1.0
  description: |
    Draft OpenAPI generated from `publicApiDocumentationCatalog.ts` for agent-readiness analysis.
    OpenConduit is a multi-tenant customer messaging / CRM platform (Fastify).
servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://api.example.com
    description: Production (placeholder)
tags:
  - name: Core
  - name: Authentication
  - name: Contacts
  - name: Conversations
  - name: Messages
  - name: Public
paths:
  /health:
    get:
      tags: [Core]
      summary: Health check
      description: Health check for load balancers and monitoring.
      responses:
        "200":
          description: Service is healthy
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: Returns JWT token for tenant routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@exemplo.com
                password:
                  type: string
                  format: password
            example:
              email: usuario@exemplo.com
              password: "<sua_senha>"
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Sign out
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User and organization context
    patch:
      tags: [Authentication]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                displayName:
                  type: string
                  nullable: true
                messageSignature:
                  type: string
                  nullable: true
                showAgentNameInChat:
                  type: boolean
      responses:
        "200":
          description: Profile updated
  /api/v1/contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            example: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            example: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated contact list
    post:
      tags: [Contacts]
      summary: Create contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: "+5511999990000"
                name:
                  type: string
                notes:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "201":
          description: Contact created
  /api/v1/contacts/{id}:
    get:
      tags: [Contacts]
      summary: Get contact
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contact details
    put:
      tags: [Contacts]
      summary: Update contact
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contact updated
    delete:
      tags: [Contacts]
      summary: Delete contact
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Contact deleted
  /api/v1/conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, PENDING, RESOLVED]
        - name: inboxId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated conversations
  /api/v1/conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get conversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation details
    put:
      tags: [Conversations]
      summary: Update conversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [OPEN, PENDING, RESOLVED]
                assignedToId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "200":
          description: Conversation updated
  /api/v1/messages:
    post:
      tags: [Messages]
      summary: Send message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactId, type]
              properties:
                contactId:
                  type: string
                  format: uuid
                conversationId:
                  type: string
                  format: uuid
                type:
                  type: string
                  enum: [TEXT, IMAGE, TEMPLATE]
                body:
                  type: string
                isPrivate:
                  type: boolean
      responses:
        "201":
          description: Message sent
  /api/v1/public/channels/inboxes/{token}/telegram:
    post:
      tags: [Public]
      summary: Telegram webhook ingest
      description: Native Telegram Bot API update webhook (token in path).
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Update accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
