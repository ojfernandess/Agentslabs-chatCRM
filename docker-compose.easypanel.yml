# Use as the LAST compose file in the deploy command (EasyPanel). Example:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.easypanel.yml up -d
#
# EasyPanel encaminha domínios pela rede Docker (Domains → serviço caddy, porta 80).
# Não publique ports no host — evita o aviso "ports is used in caddy" e conflitos com 80/443.
services:
  caddy:
    ports: []
  db:
    ports: []
  redis:
    ports: []
