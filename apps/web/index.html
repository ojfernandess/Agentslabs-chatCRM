<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6734ff" />
    <script>
      (function () {
        try {
          var locale = localStorage.getItem("openconduit_locale");
          if (locale !== "en" && locale !== "pt-BR") locale = "pt-BR";
          document.documentElement.lang = locale;
        } catch (e) {}
      })();
      (function () {
        try {
          var path = window.location.pathname || "";
          if (path === "/docs" || path.indexOf("/docs/") === 0) {
            var docsPref = localStorage.getItem("openconduit_docs_theme");
            var docsDark = docsPref === "dark";
            document.documentElement.style.colorScheme = docsDark ? "dark" : "light";
            if (docsDark) {
              document.documentElement.classList.add("docs-theme-dark");
              document.body.classList.add("docs-theme-dark");
            }
            return;
          }
          var pref = localStorage.getItem("openconduit_theme");
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>OpenNexo CRM</title>
  </head>
  <body class="bg-ink-50 text-ink-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
