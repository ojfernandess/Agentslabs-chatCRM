# API (Dockerfile): ao arrancar corre `npx prisma migrate deploy --schema=$PRISMA_SCHEMA` contra o Postgres.
# Migrações em apps/api/prisma/migrations: inclui 20260101000000_baseline_schema (BD vazia).
# Bases já existentes sem essa entrada: prisma migrate resolve --applied 20260101000000_baseline_schema
# (sem correr o SQL) se o esquema já existir; ver documentação Prisma "baseline".
# A imagem inclui o CLI `prisma` e `tsx` nas dependencies da API para o container não depender de devDependencies.
#
# Postgres: 16 no serviço `db`. Garantir que a API só inicia após db healthy.
#
# Subir: docker compose up -d --build
# Só API após novo código/migrações: docker compose build api --no-cache && docker compose up -d api
#
# PUBLIC_URL = URL público da app (API: webhooks em Configurações). Não é usado pelo Caddyfile — TLS no proxy.
#
# Variáveis ${...} vêm do ficheiro `.env` na raiz (Compose interpola automaticamente).
# EasyPanel / PaaS: definir no painel JWT_SECRET (ex.: openssl rand -hex 32), PUBLIC_URL (domínio
# público, ex.: https://crm.teudominio.com), DB_PASSWORD. Sem JWT_SECRET o contentor da API
# arranca em crash loop e fica unhealthy.
#
# web usa depends_on api: service_started (não service_healthy): o compose do EasyPanel completa
# o deploy enquanto migrações/seed correm; até a API escutar na 3000 pode haver 502 em /api — normal.
#
# Porta HTTP do Caddy no HOST (mapeada para 80 dentro do contentor). O Caddyfile só serve HTTP;
# TLS fica no EasyPanel / proxy externo. Por omissão 8080 para não colidir com 80 do servidor.
# EasyPanel: preferir docker-compose.easypanel.yml (sem ports no host) e domínio → caddy:80.
# VPS com 80 livre: CADDY_HTTP_PORT=80 no .env ou no painel.
#
# Se o deploy ainda falhar com "Bind for 0.0.0.0:80", o ficheiro docker-compose.override.yml do
# painel está a forçar "80:80". Editar no EasyPanel (ou substituir por variáveis) e remover essa
# publicação, ou usar as mesmas portas altas. Opcional: apontar o comando do painel para incluir,
# por ÚLTIMO, docker-compose.easypanel.yml (ver ficheiro) para estas portas ganharem sobre o override.
#
# Primeiro deploy: RUN_DB_SEED=true (sem espaço antes do nome da variável). Depois repor false.
# Super admin no seed: SEED_SUPER_ADMIN=1 e SUPER_ADMIN_EMAIL / SUPER_ADMIN_PASSWORD
#
# Fase B1: `api` (HTTP/WS) + `worker` (BullMQ + schedulers). Dev local sem PROCESS_ROLE = monolito.
x-openconduit-api-environment: &openconduit-api-environment
  DATABASE_URL: postgresql://openconduit:${DB_PASSWORD:-openconduit}@db:5432/openconduit
  DIRECT_DATABASE_URL: postgresql://openconduit:${DB_PASSWORD:-openconduit}@db:5432/openconduit
  PRISMA_CONNECTION_LIMIT: ${PRISMA_CONNECTION_LIMIT:-10}
  PRISMA_POOL_TIMEOUT: ${PRISMA_POOL_TIMEOUT:-20}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in environment (e.g. openssl rand -hex 32)}
  REDIS_URL: redis://redis:6379
  PORT: "3000"
  HOST: "::"
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
  WEB_APP_PUBLIC_URL: ${WEB_APP_PUBLIC_URL:-}
  AGENT_ENGINE_EXECUTION_QUEUE_ENABLED: ${AGENT_ENGINE_EXECUTION_QUEUE_ENABLED:-true}
  META_INBOUND_QUEUE_ENABLED: ${META_INBOUND_QUEUE_ENABLED:-true}
  OPENAI_PROMPT_PREVIEW_KEY: ${OPENAI_PROMPT_PREVIEW_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
  OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  GEMINI_PROMPT_PREVIEW_KEY: ${GEMINI_PROMPT_PREVIEW_KEY:-}
  MEM0_API_KEY: ${MEM0_API_KEY:-}
  MEM0_API_BASE_URL: ${MEM0_API_BASE_URL:-https://api.mem0.ai}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
  AGENT_KB_DEBUG: ${AGENT_KB_DEBUG:-}
  MEDIA_UPLOAD_DIR: /app/data/message-media
  MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-local}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
  MINIO_BUCKET: ${MINIO_BUCKET:-openconduit-media}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
  NVOIP_SIP_DOMAIN: ${NVOIP_SIP_DOMAIN:-app.nvoip.com.br}
  NVOIP_SIP_WSS_URL: ${NVOIP_SIP_WSS_URL:-}
  NVOIP_SIP_WSS_PORT: ${NVOIP_SIP_WSS_PORT:-7443}
  NVOIP_SIP_SERVER: ${NVOIP_SIP_SERVER:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_API_VERSION: ${STRIPE_API_VERSION:-}
  STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-}
  STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-}
  MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
  MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
  MERCADOPAGO_SANDBOX_ACCESS_TOKEN: ${MERCADOPAGO_SANDBOX_ACCESS_TOKEN:-}
  MERCADOPAGO_SANDBOX_PUBLIC_KEY: ${MERCADOPAGO_SANDBOX_PUBLIC_KEY:-}
  MERCADOPAGO_PRODUCTION_ACCESS_TOKEN: ${MERCADOPAGO_PRODUCTION_ACCESS_TOKEN:-}
  MERCADOPAGO_PRODUCTION_PUBLIC_KEY: ${MERCADOPAGO_PRODUCTION_PUBLIC_KEY:-}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
  MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
  MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
  MERCADOPAGO_OAUTH_REDIRECT_URI: ${MERCADOPAGO_OAUTH_REDIRECT_URI:-}
  MERCADOPAGO_CHECKOUT_SUCCESS_URL: ${MERCADOPAGO_CHECKOUT_SUCCESS_URL:-}
  MERCADOPAGO_CHECKOUT_CANCEL_URL: ${MERCADOPAGO_CHECKOUT_CANCEL_URL:-}
  NODE_ENV: production

services:
  db:
    # Imagem com extensão pgvector (busca semântica na KB). Ver migration 20260523140000_kb_chunks_pgvector.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: openconduit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-openconduit}
      POSTGRES_DB: openconduit
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem ports: — só rede Docker interna (api liga em db:5432). Dev local: docker-compose.dev.yml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openconduit"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    profiles: ["pgbouncer"]
    image: edoburu/pgbouncer:1.22.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: openconduit
      DB_PASSWORD: ${DB_PASSWORD:-openconduit}
      DB_NAME: openconduit
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF only: evita falha "Wrong RDB checksum" em dump.rdb corrompido no volume.
    command:
      - sh
      - -c
      - rm -f /data/dump.rdb && exec redis-server --appendonly yes --save ''
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: openconduit-api:local
    pull_policy: build
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-2g}
    cpus: ${API_CPUS:-2}
    environment:
      <<: *openconduit-api-environment
      PROCESS_ROLE: api
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
      SEED_SUPER_ADMIN: ${SEED_SUPER_ADMIN:-0}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-super@openconduit.dev}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-super123}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_message_media:/app/data/message-media
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r&&r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 600s

  worker:
    image: openconduit-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2}
    environment:
      <<: *openconduit-api-environment
      PROCESS_ROLE: worker
      AGENT_ENGINE_DEDICATED_WORKER: ${AGENT_ENGINE_DEDICATED_WORKER:-false}
      PRISMA_CONNECTION_LIMIT: ${WORKER_PRISMA_CONNECTION_LIMIT:-5}
      RUN_DB_SEED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - api_message_media:/app/data/message-media
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>process.exit(j&&j.role==='worker'&&j.status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 300s

  agent-worker:
    profiles: ["split-agent"]
    image: openconduit-api:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: ${AGENT_WORKER_MEM_LIMIT:-3g}
    cpus: ${AGENT_WORKER_CPUS:-3}
    environment:
      <<: *openconduit-api-environment
      PROCESS_ROLE: agent-worker
      PRISMA_CONNECTION_LIMIT: ${AGENT_WORKER_PRISMA_CONNECTION_LIMIT:-8}
      AGENT_ENGINE_CONCURRENCY: ${AGENT_ENGINE_CONCURRENCY:-4}
      AGENT_ENGINE_ORG_RATE_LIMIT_MAX: ${AGENT_ENGINE_ORG_RATE_LIMIT_MAX:-0}
      AGENT_ENGINE_ORG_RATE_LIMIT_WINDOW_MS: ${AGENT_ENGINE_ORG_RATE_LIMIT_WINDOW_MS:-60000}
      RUN_DB_SEED: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - api_message_media:/app/data/message-media
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(j=>process.exit(j&&j.role==='agent-worker'&&j.status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 300s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PUBLIC_ASSETS_VERSION: ${VITE_PUBLIC_ASSETS_VERSION:-}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  pgdata:
  api_message_media:
  redisdata:
  caddydata:
  caddyconfig:
